apiVersion: apps/v1
kind: Deployment
metadata:
  name: veridex-dashboard
  namespace: veridex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: veridex-dashboard
  template:
    metadata:
      labels:
        app: veridex-dashboard
    spec:
      containers:
        - name: dashboard
          image: veridex-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: veridex-dashboard
  namespace: veridex
spec:
  selector:
    app: veridex-dashboard
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
