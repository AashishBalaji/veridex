apiVersion: v1
kind: Secret
metadata:
  name: veridex-db-credentials
  namespace: veridex
type: Opaque
stringData:
  # Demo credentials for a local/CI cluster only -- a real deployment
  # would source this from a secret manager, not a plain manifest.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: veridex
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: veridex
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: veridex-db-credentials
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: veridex
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
